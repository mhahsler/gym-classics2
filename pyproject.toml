[build-system]
requires = ["setuptools>=68,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "gym-classics2"
version = "1.0.1"
description = "Classic discrete reinforcement-learning environments and textbook algorithms for Gymnasium"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Michael Hahsler", email = "mhahsler@smu.edu" },
]
keywords = ["reinforcement learning", "gymnasium", "MDP", "education"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "gymnasium>=1.0,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
render = ["pygame>=2.5"]
notebooks = ["ipython>=8,<10", "jupyter>=1,<2"]
scipy = ["scipy>=1.12,<2"]
docs = [
  "mkdocs-material>=9,<10",
  "mkdocstrings[python]>=0.24,<2",
]
test = ["pytest>=7,<10"]

[project.urls]
Homepage = "https://github.com/mhahsler/gym-classics2"
Documentation = "https://mhahsler.github.io/gym-classics2/"
Repository = "https://github.com/mhahsler/gym-classics2"
Issues = "https://github.com/mhahsler/gym-classics2/issues"

[tool.setuptools.packages.find]
include = ["gym_classics2*"]
